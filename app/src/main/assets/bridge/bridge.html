<html>
  <style>
    body {
        margin: 1px;
        overflow: hidden;
    }
    .raised-box {
      background-color: #f0f0f0;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .raised-box.info {
      font-size: 0.9em;
      color: #333;
    }
    .hyper-link {
      color:blue;
      cursor:pointer
    }
    /* aligns text + image in the middle */
    span.link-row {
      display: inline-flex;
      align-items: center;
      gap: 6px; /* optional spacing */
    }
    span.link-row a.hyper-link {
      display: inline-flex;
      align-items: center;
      gap: 6px; /* optional spacing between text and img */
    }
    span.link-row img {
      display: block; /* avoids baseline wobble */
    }
  </style>
  <body style="color:darkgreen; background-color:azure; padding:2px">
    <script type="module">
      import init, {
        get_greeting,
        Calculator
      } from './pkg/dumb_calculator.js';
      //let calculator = null;
      async function load() {
          await init();
          //calculator = Calculator.new(5);
          let greet = get_greeting("World");
          let elem = document.getElementById('status');
          elem.innerText = greet;
          elem.innerHTML += "&nbsp;ACalculatorApp&nbsp;is&nbsp;running!&nbsp;";
          window.Calculator = Calculator;
      }
      load();
    </script>
    <script>
      function _sync_calc() {
        let history = calc.get_history();
        let display = calc.get_display();
        let elem = document.getElementById('status');
        elem.innerText = history;
        elem.innerHTML += " &mdash; ";
        elem.innerText += display;
      }
      function new_calc() {
        calc = Calculator.new(5);
        _sync_calc();
      }
      function scrollStatusText() {
        if (typeof(calc) == "undefined") {
          let elem = document.getElementById('status');
          elem.innerText = elem.innerText.substring(1) + elem.innerText.substring(0, 1);
          setTimeout(scrollStatusText, 1000);
        }
      }
      setTimeout(scrollStatusText, 5000);
    </script>
    <div> <!-- style="color:darkgreen;background-color:azure;border:2px solid darkblue" -->
      <div id="status">... loading ...</div>
    </div>
    <!-- system info for big screen -->
    <div id="system_info" style="display:none">
      <div class="raised-box info">
        System: <span id="system_info_text"></span>
      </div>
    </div>
    <!-- device info for big screen -->
    <div id="device_info" style="display:none">
      <div class="raised-box info">
        Device: <span id="device_info_text"></span>
      </div>
    </div>
    <!-- additional messages for big screen -->
    <div id="additional_messages" style="display:none">
      <div class="raised-box" style="margin:3px; padding:3px">
        <div style="font-weight:bold">Somthing that might interest you:</div>
          <div>
            <span class="link-row">
              •
              <a class="hyper-link" onclick="AndroidBridge.onClickedAdditionalMessage('project-github')">
                GitHub repo of the project
                <img width="40px" src="https://raw.githubusercontent.com/trevorwslee/ACalculatorApp/refs/heads/master/imgs/a_calculator_app.png" alt="Project Logo"/>
              </a>
            </span>
          </div>
      </div>
    </div>
    <!-- buttons just for testing -->
    <div id="buttons" style="display:none">
      <button onclick="new_calc()">new</button>
      <button onclick="calc.push('1'); _sync_calc();">1</button>
      <button onclick="calc.push('+'); _sync_calc();">+</button>
      <button onclick="calc.push('2'); _sync_calc();">2</button>
      <button onclick="calc.push('='); _sync_calc();">=</button>
      <button onclick="calc.undo(); _sync_calc();">undo</button>
    </div>
  </body>
</html>
